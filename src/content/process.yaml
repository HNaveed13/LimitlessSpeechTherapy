heading: How therapy works
steps:
  - title: Evaluation
    text: An in-depth look at communication strengths and needs. Standardized testing, clinical observation, caregiver and teacher input, and functional measures shape personalized, meaningful goals.
  - title: Individualized intervention
    text: Therapy built on trust and real interests. Preferred topics and activities keep sessions engaging and relevant, which turns participation into lasting progress.
  - title: Collaborative care
    text: Progress that reaches beyond the therapy room. Close work with families, schools, and other providers keeps strategies consistent at home, at school, and in the community.
