heading: What we help with
intro: >-
  Every client starts with a thorough evaluation of their strengths and areas of
  need. The results shape therapy that is engaging, functional, and genuinely
  theirs.
areas:
  - title: 'Speech Sound Production & Intelligibility '
    summary: >-
      Individualized therapy to improve speech sound production, address
      articulation and phonological disorders, and increase speech clarity and
      intelligibility.
    tags:
      - Speech sound production and intelligibility
      - Articulation/Phonological Disorders
      - 'Childhood Apraxia of Speech (CAS) '
      - Oromyofunctional therapy
  - title: Receptive & Expressive Language
    summary: >-
      Therapy aims to build language skills individuals need to understand
      others, express their thoughts, and communicate with confidence. Therapy
      focuses on developing vocabulary, using complete sentences, understanding
      spoken and written language, following directions, remembering
      information, and organizing ideas for speaking and writing.
    tags:
      - Receptive and expressive language
      - Reading and dyslexia intervention (Orton-Gillingham, IMSE)
      - 'Language Processing '
      - 'Grammar/Syntax '
      - 'Vocabulary '
  - title: Social & cognitive communication
    summary: >-
      Support for connection and conversation, and for the thinking skills
      behind everyday communication.
    tags:
      - Social communication (pragmatics)
      - Cognitive communication
      - Executive functioning and ADHD support
      - Perspective Taking & Inferencing
      - Emotional Regulation & Communication
  - title: AAC & assistive communication
    summary: >-
      Individualized communication systems based on each client’s needs and
      abilities.  Training for families, caregivers, and educators to support
      consistent use across environments
    tags:
      - Augmentative and alternative communication (AAC)
      - High Tech
      - Low Tech
      - 'Visual Supports '
  - title: 'Voice & Fluency '
    summary: >-
      We help children and adults develop healthy voice habits to speak clearly,
      comfortably, and confidently. 

      We help children and adults who stutter, speak rapidly, or experience
      interruptions in the natural flow of speech. 
    tags:
      - Dysfluent Speech
      - Voice Disorders
      - Stuttering
  - title: Early intervention
    summary: >-
      Early, strengths-based support for the youngest communicators, building
      foundational skills through play, with families closely involved.
    tags:
      - Early intervention
      - Play-based
      - Family-centered
  - title: Neurodiversity-affirming care
    summary: >-
      We embrace a *neurodiversity-affirming approach* that recognizes and
      celebrates the unique ways autistic children communicate and learn. For
      children who are Gestalt Language Processors (GLPs), therapy honors their
      natural language development by building on meaningful scripts, phrases,
      and echolalia while supporting the growth of flexible, functional
      communication.
    tags:
      - Autism spectrum support
      - Gestalt language processing (GLP)
      - Echolalia and natural language development
  - title: Carryover and Generalization
    summary: >-
      We partner with families to help support their child's communication
      development beyond the therapy room by providing practical strategies that
      can be incorporated into everyday routines and activities. W
    tags:
      - 'IEP Process '
      - Language Evaluations
      - 'Advocate '
      - 'Guidance '
  - title: Beyond the session
    summary: >-
      Skills and support that carry into home, school, and community, with the
      people around each client involved.
    tags:
      - Transition and life-skills support
      - Parent coaching
      - School collaboration
